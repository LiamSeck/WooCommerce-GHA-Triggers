name: Run-Hourly-Backup
on:
  schedule:
    - cron: "0 0/1 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

env:
        WPE_API_USER_ID: ${{secrets.WPE_API_USER_ID}}
        WPE_API_PASSWORD: ${{secrets.WPE_API_PASSWORD}}
        GHA_RUN_NO: ${{github.run_number}}
        WPE_ENV: liamseprod
jobs:
  run-script:
    runs-on: ubuntu-latest
    environment: Production
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Run backup script
      run: |
        chmod +x hourly-backup.sh
        ./hourly-backup.sh
