name: Run-Hourly-Backup
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

env:
        WPE_SSHG_KEY_PRIVATE: ${{secrets.WPE_SSHG_KEY_PRIVATE}}
        GHA_RUN_NO: ${{github.run_number}}
        GHA_RUN_ID: ${{github.run_id}}
        WPE_API_USER_ID: ${{secrets.WPE_API_USER_ID}}
        WPE_API_PASSWORD: ${{secrets.WPE_API_PASSWORD}}
        WPE_ENV: liamseprod
jobs:
  run-script:
    runs-on: ubuntu-latest
    environment: Production
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Run backup script
      run: |
        chmod +x backup.sh
        ./backup.sh
